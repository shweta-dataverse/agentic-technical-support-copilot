[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.1.0"
description = "agentic industrial rag copilot for technical support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web service
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",

    # llm providers
    "openai>=1.40.0",
    "anthropic>=0.40.0",
    "azure-ai-inference>=1.0.0b6",

    # agents + retrieval
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=2.6.1",
    "rank-bm25>=0.2.2",

    # ingestion
    "pdfplumber>=0.11.0",
    "numpy>=1.26.0",

    # database (pgvector-enabled postgres)
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",

    # config
    "python-dotenv>=1.0.1",

    # evaluation + observability (used from phase 4)
    "ragas>=0.1.9",
    "rouge-score>=0.1.2",

    # legacy — still imported by the v1 modules being ported; removed in phase 2/5
    "faiss-cpu>=1.8.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# legacy v1 modules — ported/rewritten in later phases; each leaves this list
# as it is migrated (phase 2 = retrieval/agents, phase 5 = dashboard).
extend-exclude = [
    "src/copilot/app.py",
    "src/copilot/agents",
    "src/copilot/vectorstore",
    "src/copilot/ingestion",
    "src/copilot/evaluation",
    "src/copilot/workflows",
    "src/copilot/db",
    "src/copilot/llm/model.py",
    "src/copilot/llm/chains.py",
    "src/copilot/llm/prompts.py",
    "scripts",
    "init_project.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]