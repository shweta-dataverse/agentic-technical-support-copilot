[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.1.0"
description = "agentic industrial rag copilot for technical support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "sentence-transformers>=2.6.1",

    "pdfplumber>=0.11.0",
    "numpy>=1.26.0",

    "faiss-cpu>=1.8.0",
    "python-dotenv>=1.0.1",

    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",

    "streamlit>=1.36.0",
    "ragas>=0.1.9",
    "pydantic-settings>=2.3.0",

    "rank-bm25>=0.2.2",
    "rouge-score>=0.1.4",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ipykernel>=6.29.0",
    "black>=24.4.0"
]