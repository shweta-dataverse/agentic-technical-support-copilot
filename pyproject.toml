[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot"
version = "0.2.0"
description = "agentic industrial rag copilot for technical support"
readme = "README.md"
requires-python = ">=3.12"
# application, not library: direct dependencies are pinned exactly so every
# environment (dev, CI, container) resolves the same versions.
dependencies = [
    # web service
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",

    # llm providers
    "openai==2.15.0",
    "anthropic==0.116.0",
    "azure-ai-inference==1.0.0b9",

    # agents + retrieval
    "azure-search-documents==12.0.0",
    "azure-identity==1.25.3",
    "langchain==1.2.7",
    "langchain-text-splitters==1.1.0",
    "langgraph==1.0.7",
    "sentence-transformers==5.2.0",
    "rank-bm25==0.2.2",

    # ingestion
    "pdfplumber==0.11.9",
    "numpy==2.4.1",
    "presidio-analyzer==2.2.363",
    "presidio-anonymizer==2.2.363",
    "spacy==3.8.13",

    # database
    "sqlalchemy==2.0.46",
    "psycopg[binary]==3.3.1",
    "pgvector==0.4.2",
    "alembic==1.18.1",

    # config + logging
    "python-dotenv==1.2.1",
    "structlog==25.5.0",

    # evaluation + observability (used from the evaluation-plane step)
    "ragas==0.4.3",
    "rouge-score==0.1.2",

    # legacy — still imported by the v1 modules being ported; removed with the
    # retrieval-layer and UI steps
    "faiss-cpu==1.13.2",
    "streamlit==1.53.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "mypy==1.19.1",
    "ipykernel>=6.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# legacy v1 modules — ported/rewritten in later steps; each leaves this list
# as it is migrated.
extend-exclude = [
    "src/copilot/app.py",
    "src/copilot/agents",
    "src/copilot/vectorstore",
    "src/copilot/ingestion/pdf_loader.py",
    "src/copilot/ingestion/text_splitter.py",
    "src/copilot/ingestion/embedder.py",
    "src/copilot/evaluation",
    "src/copilot/workflows",
    "src/copilot/llm/model.py",
    "src/copilot/llm/chains.py",
    "src/copilot/llm/prompts.py",
    "scripts",
    "init_project.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# alembic autogenerated revisions are machine-formatted
"src/copilot/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# v2 surface only — legacy modules join as they are ported (same list as ruff).
files = [
    "src/copilot/config.py",
    "src/copilot/exceptions.py",
    "src/copilot/api",
    "src/copilot/db",
    "src/copilot/ingestion/chunking.py",
    "src/copilot/ingestion/masking.py",
    "src/copilot/ingestion/embedding.py",
    "src/copilot/ingestion/indexer.py",
    "src/copilot/ingestion/pdf.py",
    "src/copilot/ingestion/pipeline.py",
    "src/copilot/ingestion/cli.py",
    "src/copilot/llm/providers",
    "src/copilot/retrieval",
    "src/copilot/messaging",
    "src/copilot/security",
    "src/copilot/telemetry",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "azure.ai.inference.*",
    "rank_bm25.*",
    "faiss.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "pdfplumber.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
