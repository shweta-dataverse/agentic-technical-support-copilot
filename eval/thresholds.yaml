# Regression gate: an eval run fails if any metric falls below its floor.
# Floors are set from the current baseline with headroom; tighten as the
# system improves. PRs touching prompts/, agents/, or retrieval/ run the gate.

retrieval_precision_at_k: 0.30
retrieval_recall_at_k: 0.60
fabricated_citation_rate_max: 0.0    # fabricated citations are never acceptable
escalation_accuracy: 0.80
faithfulness: 0.70
answer_relevancy: 0.70
# calibration watch: mean confidence on well-covered cases should be healthy.
# starts low deliberately (documents the known under-calibration) and is
# raised once the synthesis prompt is improved through this gate.
mean_confidence_covered: 0.30
