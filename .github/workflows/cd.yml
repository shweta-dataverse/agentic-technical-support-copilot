name: CD

# Deploys on merge to main: build the three images tagged by commit SHA, push
# to ACR, roll each container app to the new revision, smoke-test, and roll
# back the api on failure. Authenticates to Azure with OIDC (a federated
# credential) so no cloud secret is stored in GitHub.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker/**"
      - "prompts/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  ACR: copilotdevacr4hpjxf
  RG: copilot-dev-rg
  API_APP: copilot-dev-api
  WORKER_APP: copilot-dev-worker
  UI_APP: copilot-dev-ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ties deploys to the GitHub "production" environment: deployment history,
    # a live-URL link on the repo, and optional required-reviewer protection
    environment:
      name: production
      url: https://copilot-dev-api.salmontree-91d55cea.swedencentral.azurecontainerapps.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push images
        run: |
          for t in api worker ui; do
            az acr build --registry "$ACR" --image "copilot-$t:$TAG" \
              --file docker/Dockerfile --target "$t" .
          done

      - name: Capture current api revision (for rollback)
        run: |
          echo "PREV_REV=$(az containerapp revision list -n "$API_APP" -g "$RG" \
            --query "[?properties.active].name | [0]" -o tsv)" >> "$GITHUB_ENV"

      - name: Deploy new revisions
        run: |
          az containerapp update -n "$API_APP" -g "$RG" \
            --image "$ACR.azurecr.io/copilot-api:$TAG" -o none
          az containerapp update -n "$WORKER_APP" -g "$RG" \
            --image "$ACR.azurecr.io/copilot-worker:$TAG" -o none
          az containerapp update -n "$UI_APP" -g "$RG" \
            --image "$ACR.azurecr.io/copilot-ui:$TAG" -o none

      - name: Smoke test
        run: |
          API_URL="https://$(az containerapp show -n "$API_APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/ready" || true)
            [ "$code" = "200" ] && echo "ready" && exit 0
            sleep 10
          done
          echo "smoke test failed" && exit 1

      - name: Roll back api on failure
        if: failure() && env.PREV_REV != ''
        run: |
          az containerapp ingress traffic set -n "$API_APP" -g "$RG" \
            --revision-weight "$PREV_REV=100"
