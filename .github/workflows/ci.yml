name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_md

      - name: Lint (ruff)
        run: ruff check src tests ui

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        target: [api, worker, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.target }} image
        run: docker build --target ${{ matrix.target }} -f docker/Dockerfile -t copilot-${{ matrix.target }}:ci .

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
