# Local dev stack: API + pgvector-enabled Postgres.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: jira_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d jira_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # override the host so the app reaches the compose DB service
      DATABASE_URL: postgresql+psycopg://copilot:copilot@db:5432/jira_copilot
    ports:
      - "8000:8000"

volumes:
  pgdata:
